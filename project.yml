name: GhueyPrompt
options:
  bundleIdPrefix: com.homesetv
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "$(SIGN_IDENTITY)"
    SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  GhueyPrompt:
    type: application
    platform: macOS
    sources:
      - path: GhueyPrompt
    info:
      path: GhueyPrompt/Resources/Info.plist
      properties:
        CFBundleDisplayName: Ghuey Prompt
        CFBundleName: Ghuey Prompt
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        LSUIElement: true
        NSHumanReadableCopyright: ""
        NSServices:
          - NSMenuItem:
              default: Save to Ghuey Prompt
            NSMessage: savePrompt
            NSPortName: Ghuey Prompt
            NSSendTypes:
              - NSStringPboardType
              - public.utf8-plain-text
            NSRequiredContext: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homesetv.GhueyPrompt
        PRODUCT_NAME: Ghuey Prompt
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
  GhueyPromptTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: GhueyPromptTests
    dependencies:
      - target: GhueyPrompt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.homesetv.GhueyPromptTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Ghuey Prompt.app/Contents/MacOS/Ghuey Prompt"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  GhueyPrompt:
    build:
      targets:
        GhueyPrompt: all
        GhueyPromptTests: [test]
    test:
      targets:
        - GhueyPromptTests
